name: Deploy BE Docker to Elastic Beanstalk

on:
  push:
    branches: [main]
    paths:
      - "BE/**"
      - ".github/workflows/deploy-be-elasticbeanstalk.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-be:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BE/package-lock.json

      - name: Install backend dependencies
        working-directory: BE
        run: npm ci

      - name: Validate Prisma schema
        working-directory: BE
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma validate

      - name: Run backend tests
        working-directory: BE
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: test_jwt_secret_for_ci
          REDIS_URL: redis://localhost:6379
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: field-images
          PAYMENT_PROVIDER: sepay
          EMAIL_PROVIDER: ethereal
        run: npx jest --verbose --runInBand

      - name: Build Docker image
        run: docker build -t fieldnow-be:${{ github.sha }} BE

      - name: Apply database migrations
        working-directory: BE
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Create Elastic Beanstalk source bundle
        run: |
          cd BE
          zip -r ../fieldnow-be-docker.zip Dockerfile .dockerignore package.json package-lock.json src prisma

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload bundle to S3
        run: |
          aws s3 cp fieldnow-be-docker.zip s3://${{ vars.EB_S3_BUCKET }}/fieldnow-be-${{ github.sha }}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ vars.EB_APPLICATION_NAME }}" \
            --version-label "be-${{ github.sha }}" \
            --source-bundle S3Bucket="${{ vars.EB_S3_BUCKET }}",S3Key="fieldnow-be-${{ github.sha }}.zip"

      - name: Deploy to Elastic Beanstalk environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ vars.EB_ENVIRONMENT_NAME }}" \
            --version-label "be-${{ github.sha }}"

      - name: Wait for Elastic Beanstalk deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${{ vars.EB_ENVIRONMENT_NAME }}"
