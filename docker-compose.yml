version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fieldnow-db
    restart: always
    environment:
      POSTGRES_USER: fieldnow
      POSTGRES_PASSWORD: ${FIELDNOW_DB_PASS:-fieldnow_local_dev_pass}
      POSTGRES_DB: fieldnow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldnow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fieldnow-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: ./BE
      dockerfile: Dockerfile
    container_name: fieldnow-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://fieldnow:${FIELDNOW_DB_PASS:-fieldnow_local_dev_pass}@db:5432/fieldnow?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-fieldnow_local_dev_secret_change_me}
      - JWT_EXPIRES_IN=1d
      - EMAIL_PROVIDER=ethereal
      - PAYMENT_PROVIDER=sepay
      - SEPAY_ENV=sandbox
      - SEPAY_MERCHANT_ID=${SEPAY_MERCHANT_ID:-demo_merchant_id}
      - SEPAY_SECRET_KEY=${SEPAY_SECRET_KEY:-demo_secret_key}
      - SEPAY_SUCCESS_URL=http://localhost:3000/payment/success
      - SEPAY_ERROR_URL=http://localhost:3000/payment/error
      - SEPAY_CANCEL_URL=http://localhost:3000/payment/cancel
    command: >
      sh -c "npx prisma migrate deploy &&
             npx prisma db seed &&
             npm run dev"
    volumes:
      - ./BE:/app
      - /app/node_modules

volumes:
  pgdata:
  redisdata:
