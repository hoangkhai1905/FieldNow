version: '3.8'

services:
  # BullMQ Dashboard
  bullmq-ui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      # Option 1: Local Redis (uncomment redis service below)
      # REDIS_HOST: redis
      # REDIS_PORT: 6379
      
      # Option 2: Upstash Redis (use this for production)
      REDIS_URL: ${REDIS_URL:-redis://:password@localhost:6379}
      
      PORT: 3001
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Local Redis (optional, for development only)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
